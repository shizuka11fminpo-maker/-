<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レシートOCR・スプレッドシート登録</title>
  <style>
    body { font-family: sans-serif; margin: 16px; max-width: 600px; margin: auto; padding: 16px; }
    fieldset { margin-bottom: 16px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input[type="text"], input[type="date"] { width: 100%; padding: 12px; box-sizing: border-box; margin-top: 4px; font-size: 16px; }
    button { width: 100%; padding: 14px; font-size: 16px; margin-top: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background-color: #ccc; }
    #preview { max-width: 100%; height: auto; margin-top: 8px; display: none; border-radius: 4px; }
    .loading { color: #d9534f; font-weight: bold; display: none; margin-top: 8px; font-size: 15px; }
    .note { font-size: 13px; color: #555; margin-top: 6px; }
  </style>
</head>
<body>

  <h2>レシート登録アプリ（サーバーOCR）</h2>

  <fieldset>
    <legend>1. レシート撮影・選択</legend>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <div class="note">撮影または画像を選ぶと、自動でGAS側でOCR解析されます</div>
    <img id="preview" alt="レシート画像プレビュー">
    <div id="loadingText" class="loading">GoogleサーバーでOCR解析中...数秒お待ちください</div>
  </fieldset>

  <fieldset>
    <legend>2. 抽出結果の確認・編集</legend>
    <label for="dateInput">利用日</label>
    <input type="date" id="dateInput">

    <label for="storeInput">店名</label>
    <input type="text" id="storeInput" placeholder="店名">

    <label for="amountInput">金額 (円)</label>
    <input type="text" id="amountInput" placeholder="金額">
  </fieldset>

  <button id="submitBtn">スプレッドシートへ登録</button>

  <script>
    // ★ GASで発行したウェブアプリのURLをここに貼り付け
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzY8K-wI0r8cfcnXjOgRvgAu5sDuxt0jRZN--OHecjH2ix8-zDIfAl1SyC4C8xSLib8dA/exec";

    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const loadingText = document.getElementById('loadingText');
    const dateInput = document.getElementById('dateInput');
    const storeInput = document.getElementById('storeInput');
    const amountInput = document.getElementById('amountInput');
    const submitBtn = document.getElementById('submitBtn');

    let uploadedImageUrl = "";

    dateInput.value = new Date().toISOString().split('T')[0];

    // 画像選択 ＆ GASへ送ってOCR解析してもらう
    cameraInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      alert(file.size);
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (event) => {
        const base64Image = event.target.result;
        preview.src = base64Image;
        preview.style.display = 'block';
        uploadedImageUrl = base64Image;

        // ローディング表示
        loadingText.style.display = 'block';
        submitBtn.disabled = true;

        try {
          // 画像をGASに送ってOCR結果を返してもらう
          const response = await fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORS回避の定番手法
            body: JSON.stringify({ imageUrl: base64Image })
          });

          const result = await response.json();
          if (result.status === "success") {
            if (result.date) dateInput.value = result.date;
            if (result.store) storeInput.value = result.store;
            if (result.amount) amountInput.value = result.amount;
          }
        } catch (err) {
          console.error("OCR通信エラー:", err);
          // エラーでも手動入力できるよう続行
        } finally {
          loadingText.style.display = 'none';
          submitBtn.disabled = false;
        }
      };
      reader.readAsDataURL(file);
    });

    // 登録ボタン押下時
    submitBtn.addEventListener('click', async () => {
      if (!amountInput.value) {
        alert("金額を入力してください。");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "登録中...";

      const payload = {
        date: dateInput.value,
        store: storeInput.value || "不明な店舗",
        amount: amountInput.value,
        imageUrl: uploadedImageUrl.length > 50000 ? "画像データ大" : uploadedImageUrl
      };

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        alert("スプレッドシートへ登録しました！");
        
        // リセット
        cameraInput.value = "";
        preview.style.display = 'none';
        storeInput.value = "";
        amountInput.value = "";
        dateInput.value = new Date().toISOString().split('T')[0];
        uploadedImageUrl = "";

      } catch (err) {
        alert("登録に失敗しました: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "スプレッドシートへ登録";
      }
    });
  </script>
</body>
</html>
