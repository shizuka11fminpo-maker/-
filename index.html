<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レシートOCRスプレッドシート登録</title>
  <!-- Tesseract.js読み込み -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 16px; max-width: 600px; margin: auto; padding: 16px; }
    fieldset { margin-bottom: 16px; padding: 12px; }
    label { display: block; margin-top: 8px; font-weight: bold; }
    input[type="text"], input[type="date"] { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    button { width: 100%; padding: 12px; font-size: 16px; margin-top: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; }
    button:disabled { background-color: #ccc; }
    #preview { max-width: 100%; height: auto; margin-top: 8px; display: none; }
    .loading { color: #d9534f; font-weight: bold; display: none; margin-top: 8px; }
  </style>
</head>
<body>

  <h2>レシート登録アプリ</h2>

  <fieldset>
    <legend>1. レシート撮影</legend>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <img id="preview" alt="レシート画像プレビュー">
    <div id="loadingText" class="loading">OCR解析中...しばらくお待ちください</div>
  </fieldset>

  <fieldset>
    <legend>2. 抽出結果の確認・編集</legend>
    <label for="dateInput">利用日</label>
    <input type="date" id="dateInput">

    <label for="storeInput">店名</label>
    <input type="text" id="storeInput">

    <label for="amountInput">金額</label>
    <input type="text" id="amountInput">
  </fieldset>

  <button id="submitBtn" disabled>スプレッドシートへ登録</button>

  <script>
    // ★ ここにGASで発行した「ウェブアプリのURL」を貼り付けてください
    https://script.google.com/macros/s/AKfycbywlrj5oXujnb0WARmw8w-QogfPtAIX0SxbwAd6t8MBo3EpTpwjS7KGi-ahjQKsdzC2dQ/exec

    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const loadingText = document.getElementById('loadingText');
    const dateInput = document.getElementById('dateInput');
    const storeInput = document.getElementById('storeInput');
    const amountInput = document.getElementById('amountInput');
    const submitBtn = document.getElementById('submitBtn');

    let uploadedImageUrl = "";

    cameraInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // プレビュー表示
      const reader = new FileReader();
      reader.onload = (event) => {
        preview.src = event.target.result;
        preview.style.display = 'block';
        // 画像データURLをそのままE列用、またはプレビュー用として保持
        uploadedImageUrl = event.target.result; 
      };
      reader.readAsDataURL(file);

      // OCR実行
      loadingText.style.display = 'block';
      submitBtn.disabled = true;

      try {
        const result = await Tesseract.recognize(file, 'jpn+eng');
        const text = result.data.text;
        
        parseReceiptText(text);
        submitBtn.disabled = false;
      } catch (err) {
        alert('OCR解析に失敗しました: ' + err.message);
      } finally {
        loadingText.style.display = 'none';
      }
    });

    // レシートテキストから日付・店名・金額を簡易抽出する関数
    function parseReceiptText(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      // 1. 日付抽出 (例: 2026/09/15, 2026年9月15日 など)
      const dateRegex = /(\d{4})[年/-](\d{1,2})[月/-](\d{1,2})日?/;
      for (const line of lines) {
        const match = line.match(dateRegex);
        if (match) {
          const y = match[1];
          const m = match[2].padStart(2, '0');
          const d = match[3].padStart(2, '0');
          dateInput.value = `${y}-${m}-${d}`;
          break;
        }
      }

      // 2. 金額抽出 (合計、計、合計金額などの周辺、または最も大きな数値や末尾の数値などを想定)
      // ここでは「合計」キーワードがある行、または「合 計」などの行を探す
      let foundAmount = "";
      for (let i = 0; i < lines.length; i++) {
        if (/合計|小計|総額|代金/.test(lines[i])) {
          // 同行または次行から数字を探す
          const numMatch = lines[i].match(/([1-9][0-9,]{2,})/);
          if (numMatch) {
            foundAmount = numMatch[1].replace(/,/g, '');
            break;
          } else if (i + 1 < lines.length) {
            const nextMatch = lines[i+1].match(/([1-9][0-9,]{2,})/);
            if (nextMatch) {
              foundAmount = nextMatch[1].replace(/,/g, '');
              break;
            }
          }
        }
      }
      // 見つからなければ金額っぽい最大値を抽出
      if (!foundAmount) {
        const allNums = text.match(/([1-9][0-9,]{2,})/g);
        if (allNums && allNums.length > 0) {
          const cleanNums = allNums.map(n => parseInt(n.replace(/,/g, ''), 10));
          foundAmount = Math.max(...cleanNums);
        }
      }
      amountInput.value = foundAmount;

      // 3. 店名抽出 (上部にある文字列を採用する簡易ロジック)
      if (lines.length > 0) {
        storeInput.value = lines[0];
      }
    }

    // 登録ボタン押下時
    submitBtn.addEventListener('click', async () => {
      if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("YOUR_GAS")) {
        alert("GASのウェブアプリURLが設定されていません。");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "登録中...";

      const payload = {
        date: dateInput.value,
        store: storeInput.value,
        amount: amountInput.value,
        imageUrl: uploadedImageUrl.length > 50000 ? "画像データ大のため省略" : uploadedImageUrl // データサイズ対策
      };

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors', // GASへのCORS回避
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        alert("スプレッドシートへ登録しました！");
        // リセット
        cameraInput.value = "";
        preview.style.display = 'none';
        dateInput.value = "";
        storeInput.value = "";
        amountInput.value = "";
      } catch (err) {
        alert("登録に失敗しました: " + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "スプレッドシートへ登録";
      }
    });
  </script>
</body>
</html>
